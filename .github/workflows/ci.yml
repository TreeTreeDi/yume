name: ci

on:
  pull_request:
  push:
    branches:
      - mvp

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx tsx test/parsers.ts
      - run: npx tsx test/since.ts
      - run: npx tsx test/tui.ts
